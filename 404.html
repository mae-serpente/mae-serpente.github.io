<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Mãe Serpente</title>
<meta name="description" content="A página que você procura não existe. Volte para o site oficial da banda Mãe Serpente.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140b10">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --void:#140b10; --ember:#e8622c; --ember-deep:#b53c17; --bone:#ece2d3; --bone-dim:#a8958c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 24px; text-align:center;
    background:radial-gradient(ellipse at 50% 35%, rgba(90,47,104,0.35), transparent 65%), var(--void);
    color:var(--bone); font-family:'Space Grotesk', sans-serif; line-height:1.6;
  }
  img{ display:block; width:auto; height:min(36vh, 260px); margin:0 auto 28px; }
  h1{ font-family:'Archivo Black', sans-serif; font-size:clamp(32px, 7vw, 56px); line-height:1.05; margin-bottom:14px; }
  p{ color:var(--bone-dim); max-width:420px; margin:0 auto 32px; }
  a.btn{
    display:inline-flex; align-items:center; min-height:48px; padding:14px 28px;
    background:var(--ember); color:var(--void); font-weight:600; font-size:15px;
    text-decoration:none; border-radius:2px;
  }
  a.btn:hover{ background:var(--ember-deep); color:var(--bone); }
  a:focus-visible{ outline:2px solid var(--bone); outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <img src="/emblema-serpente.webp" width="352" height="540" alt="" decoding="async">
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe. Volte para o site oficial da Mãe Serpente.</p>
    <a class="btn" href="/">Voltar para o início</a>
  </main>
</body>
</html>
